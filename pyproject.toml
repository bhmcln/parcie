[project]
name = "parcie-engine"
version = "0.1.0"
description = "CP-SAT pallet packing engine for parcie"
requires-python = ">=3.13"
dependencies = [
    "ortools>=9.11",
    "click>=8.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
# This is an application, not a distributable library: don't try to build/install it.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
